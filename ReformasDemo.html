<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a1a1a">
<title>ObraExpress v1.2 - Calculadora + Márgenes</title>
<style>
  :root {
    --bg: #0f0f0f;
    --card: #1a1a1a;
    --card-hover: #222;
    --accent: #ff6b00;
    --accent-hover: #ff8533;
    --text: #f0f0f0;
    --text-dim: #888;
    --border: #333;
    --success: #4caf50;
    --danger: #f44336;
    --info: #2196f3;
    --warning: #ff9800;
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 16px;
    min-height: 100vh;
    overflow-x: hidden;
  }
  button { font-family: inherit; cursor: pointer; border: none; }
  input, textarea, select {
    font-family: inherit;
    font-size: 16px;
    background: #000;
    color: var(--text);
    border: 1px solid var(--border);
    padding: 14px;
    border-radius: 8px;
    width: 100%;
  }
  input:focus, textarea:focus, select:focus {
    outline: none;
    border-color: var(--accent);
  }
  label {
    display: block;
    font-size: 0.8rem;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 6px;
    margin-top: 12px;
  }
  .container { max-width: 600px; margin: 0 auto; padding: 16px; padding-bottom: 80px; }
  
  .header {
    background: var(--card);
    padding: 16px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .header h1 { font-size: 1.2rem; color: var(--accent); font-weight: 700; }
  .header .back-btn { background: transparent; color: var(--accent); font-size: 1.5rem; padding: 8px 12px; }
  
  .btn-big {
    width: 100%;
    padding: 20px;
    background: var(--accent);
    color: #000;
    font-size: 1.1rem;
    font-weight: 700;
    border-radius: 12px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 12px;
    transition: transform 0.1s;
  }
  .btn-big:active { transform: scale(0.98); }
  .btn-big.secondary { background: var(--card); color: var(--text); border: 1px solid var(--border); }
  .btn-big.danger { background: var(--danger); color: #fff; }
  .btn-big.success { background: var(--success); color: #fff; }
  .btn-big.info { background: var(--info); color: #fff; }
  .btn-big .icon { font-size: 1.5rem; }
  
  .btn {
    padding: 14px 20px;
    background: var(--accent);
    color: #000;
    font-weight: 700;
    border-radius: 8px;
    font-size: 1rem;
  }
  .btn.secondary { background: var(--card); color: var(--text); border: 1px solid var(--border); }
  
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
  }
  .card.clickable { cursor: pointer; transition: background 0.15s; }
  .card.clickable:active { background: var(--card-hover); }
  .card h3 { font-size: 1.1rem; margin-bottom: 4px; }
  .card .meta { color: var(--text-dim); font-size: 0.85rem; }
  
  .stats {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-bottom: 20px;
  }
  .stat {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    text-align: center;
  }
  .stat .num { font-size: 1.8rem; font-weight: 700; color: var(--accent); }
  .stat .label { font-size: 0.75rem; color: var(--text-dim); text-transform: uppercase; margin-top: 4px; }
  
  .list-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 8px;
  }
  .list-item .info { flex: 1; }
  .list-item .title { font-weight: 600; }
  .list-item .subtitle { color: var(--text-dim); font-size: 0.85rem; margin-top: 2px; }
  .list-item .actions { display: flex; gap: 8px; }
  .icon-btn {
    background: transparent;
    color: var(--text-dim);
    padding: 8px;
    border-radius: 6px;
    font-size: 1.2rem;
  }
  .icon-btn:active { background: var(--card-hover); }
  .icon-btn.danger { color: var(--danger); }
  
  .line-item {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 8px;
  }
  .line-item .row {
    display: grid;
    grid-template-columns: 2fr 1fr 1fr;
    gap: 8px;
    margin-bottom: 8px;
  }
  .line-item input { padding: 10px; font-size: 14px; }
  .line-item .total {
    text-align: right;
    font-weight: 700;
    color: var(--accent);
    font-size: 1.1rem;
  }
  
  .totals {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-top: 16px;
  }
  .totals .row {
    display: flex;
    justify-content: space-between;
    padding: 6px 0;
    font-size: 1rem;
  }
  .totals .row.grand {
    border-top: 1px solid var(--border);
    margin-top: 8px;
    padding-top: 12px;
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--accent);
  }
  
  .hidden { display: none !important; }
  .empty { text-align: center; padding: 40px 20px; color: var(--text-dim); }
  .empty .icon { font-size: 3rem; margin-bottom: 12px; }
  
  .tabs {
    display: flex;
    background: var(--card);
    border-radius: 10px;
    padding: 4px;
    margin-bottom: 16px;
  }
  .tab {
    flex: 1;
    padding: 12px;
    text-align: center;
    background: transparent;
    color: var(--text-dim);
    border-radius: 8px;
    font-weight: 600;
  }
  .tab.active { background: var(--accent); color: #000; }
  
  .template-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }
  .template-card {
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    text-align: center;
    cursor: pointer;
    transition: all 0.15s;
  }
  .template-card:active { border-color: var(--accent); }
  .template-card .icon { font-size: 2rem; margin-bottom: 8px; }
  .template-card .name { font-weight: 600; font-size: 0.95rem; }
  
  /* CALCULADORA */
  .calc-section {
    background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%);
    border: 2px solid var(--accent);
    border-radius: 12px;
    padding: 20px;
    margin: 16px 0;
  }
  .calc-section h3 {
    color: var(--accent);
    margin-bottom: 16px;
    font-size: 1.2rem;
  }
  .calc-input-group {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 16px;
  }
  .calc-result {
    background: rgba(0,0,0,0.3);
    border-radius: 8px;
    padding: 16px;
    margin-top: 16px;
  }
  .calc-item {
    display: flex;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .calc-item:last-child { border-bottom: none; }
  .calc-item .name { flex: 1; font-size: 0.9rem; }
  .calc-item .qty { color: var(--accent); font-weight: 700; margin: 0 12px; }
  .calc-item .price { color: var(--text-dim); font-size: 0.85rem; }
  
  .calc-total {
    margin-top: 16px;
    padding-top: 16px;
    border-top: 2px solid var(--accent);
    display: flex;
    justify-content: space-between;
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--accent);
  }
  
  .margin-control {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin: 16px 0;
  }
  .margin-control h4 {
    color: var(--warning);
    margin-bottom: 12px;
    font-size: 1rem;
  }
  .margin-slider {
    width: 100%;
    margin: 12px 0;
  }
  .margin-display {
    text-align: center;
    font-size: 2rem;
    font-weight: 700;
    color: var(--warning);
    margin: 12px 0;
  }
  
  .dual-budget {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 16px;
  }
  .budget-card {
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    text-align: center;
  }
  .budget-card.cost { border-color: var(--info); }
  .budget-card.sale { border-color: var(--success); }
  .budget-card .label {
    font-size: 0.75rem;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .budget-card .amount {
    font-size: 1.5rem;
    font-weight: 700;
  }
  .budget-card.cost .amount { color: var(--info); }
  .budget-card.sale .amount { color: var(--success); }
  
  .info-box {
    background: rgba(33, 150, 243, 0.1);
    border-left: 3px solid var(--info);
    padding: 12px;
    border-radius: 4px;
    margin: 12px 0;
    font-size: 0.9rem;
    color: var(--text);
  }
  
  @media (min-width: 768px) {
    .container { padding: 24px; }
  }
</style>
</head>
<body>

<div id="app"></div>

<script>

  mano_obra_oficial: { name: "Mano de obra oficial 1ª", price: 27.00, unit: "hora" }

// ---------- RATIOS DE CONSUMO ----------
const CONSUMPTION_RATIOS = {
  mortero_cola_por_m2: 1/4.5, // 1 saco (25kg) cubre ~4.5 m²
  azulejo_desperdicio: 1.10, // 10% de desperdicio
  pintura_litros_por_m2: 0.20, // 1L por 5 m² (2 manos)
  horas_alicatado_por_m2: 0.6,
  horas_desescombro_por_m2: 0.4,
  horas_alisado_por_m2: 0.5,
  horas_pintura_por_m2: 0.3
};

// ---------- PLANTILLAS DE PRESUPUESTO ----------
const DEFAULT_TEMPLATES = [
  { 
    id: 'bano', 
    name: 'Reforma Baño', 
    icon: '🚿',
    description: 'Reforma completa de baño estándar (4-6 m²)',
    items: [
      { name: 'Desescombro y demolición', unit: 'm²', price: 18, auto: true, type: 'labor' },
      { name: 'Alicatado paredes (material + mano obra)', unit: 'm²', price: 50, auto: true, type: 'combined' },
      { name: 'Solado (material + mano obra)', unit: 'm²', price: 53, auto: true, type: 'combined' },
      { name: 'Plato de ducha resina', unit: 'ud', price: 200, auto: false },
      { name: 'Inodoro completo', unit: 'ud', price: 170, auto: false },
      { name: 'Mueble lavabo + espejo + grifo', unit: 'conjunto', price: 350, auto: false },
      { name: 'Mampara cristal templado', unit: 'ud', price: 250, auto: false }
    ]
  },
  { 
    id: 'cocina', 
    name: 'Reforma Cocina', 
    icon: '🍳',
    description: 'Reforma completa de cocina estándar (8-12 m²)',
    items: [
      { name: 'Desescombro y demolición', unit: 'm²', price: 18, auto: true, type: 'labor' },
      { name: 'Alicatado paredes', unit: 'm²', price: 50, auto: true, type: 'combined' },
      { name: 'Solado', unit: 'm²', price: 53, auto: true, type: 'combined' },
      { name: 'Encimera', unit: 'ml', price: 180, auto: false },
      { name: 'Muebles cocina', unit: 'ml', price: 450, auto: false },
      { name: 'Fregadero + grifo', unit: 'conjunto', price: 220, auto: false },
      { name: 'Electrodomésticos', unit: 'pack', price: 1200, auto: false },
      { name: 'Fontanería', unit: 'h', price: 27, auto: false },
      { name: 'Electricidad', unit: 'h', price: 28, auto: false }
    ]
  },
  { 
    id: 'pintura', 
    name: 'Pintura', 
    icon: '🎨',
    description: 'Pintura de paredes y techos',
    items: [
      { name: 'Alisado paredes (quitar gotelé)', unit: 'm²', price: 15, auto: true, type: 'labor' },
      { name: 'Pintura paredes (2 manos, material incluido)', unit: 'm²', price: 11, auto: true, type: 'combined' },
      { name: 'Pintura techos', unit: 'm²', price: 12, auto: true, type: 'combined' },
      { name: 'Pintura puertas', unit: 'ud', price: 45, auto: false }
    ]
  },
  { 
    id: 'alicatado', 
    name: 'Alicatado', 
    icon: '🧱',
    description: 'Alicatado de paredes y solado',
    items: [
      { name: 'Alicatado paredes (material + mano obra)', unit: 'm²', price: 50, auto: true, type: 'combined' },
      { name: 'Solado (material + mano obra)', unit: 'm²', price: 53, auto: true, type: 'combined' },
      { name: 'Rodapié', unit: 'ml', price: 12, auto: false }
    ]
  },
  { 
    id: 'tabiqueria', 
    name: 'Tabiquería', 
    icon: '🏗️',
    description: 'Levantar tabiques y puertas',
    items: [
      { name: 'Tabique ladrillo (material + mano obra)', unit: 'm²', price: 65, auto: true, type: 'combined' },
      { name: 'Tabique pladur (material + mano obra)', unit: 'm²', price: 55, auto: true, type: 'combined' },
      { name: 'Puerta interior + marco', unit: 'ud', price: 280, auto: false }
    ]
  },
  { 
    id: 'custom', 
    name: 'Personalizado', 
    icon: '️', 
    description: 'Crear presupuesto desde cero',
    items: [] 
  }
];

// ---------- ESTADO ----------
let state = {
  view: 'dashboard',
  clients: [],
  budgets: [],
  invoices: [],
  templates: DEFAULT_TEMPLATES,
  config: {
    businessName: 'Mi Empresa de Reformas',
    nif: '',
    address: '',
    phone: '',
    email: '',
    iban: '',
    ivaRate: 21,
    defaultMargin: 30 // Margen de beneficio por defecto (%)
  }
};

function loadState() {
  try {
    const saved = localStorage.getItem(STORE_KEY);
    if (saved) {
      const parsed = JSON.parse(saved);
      state = { ...state, ...parsed };
    }
    const config = localStorage.getItem(CONFIG_KEY);
    if (config) state.config = { ...state.config, ...JSON.parse(config) };
  } catch(e) { console.error('Error cargando datos:', e); }
}

function saveState() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify({
      clients: state.clients,
      budgets: state.budgets,
      invoices: state.invoices,
      templates: state.templates
    }));
    localStorage.setItem(CONFIG_KEY, JSON.stringify(state.config));
  } catch(e) { console.error('Error guardando:', e); }
}

// ---------- UTILS ----------
const uid = () => Date.now().toString(36) + Math.random().toString(36).substr(2, 5);
const fmt = (n) => new Intl.NumberFormat('es-ES', { style: 'currency', currency: 'EUR' }).format(n || 0);
const today = () => new Date().toISOString().split('T')[0];

function escapeHtml(s) {
  if (!s) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ---------- CALCULADORA AUTOMÁTICA ----------
function calculateMaterials(workType, squareMeters) {
  const results = [];
  let totalCost = 0;
  
  switch(workType) {
    case 'alicatado':
      const azulejoM2 = squareMeters * CONSUMPTION_RATIOS.azulejo_desperdicio;
      const azulejoCost = azulejoM2 * MATERIAL_MARKET_PRICES.gres_porcelanico.price;
      results.push({
        name: `Azulejo gres porcelánico (${azulejoM2.toFixed(1)} m² con 10% desperdicio)`,
        qty: azulejoM2.toFixed(1),
        unit: 'm²',
        price: MATERIAL_MARKET_PRICES.gres_porcelanico.price,
        total: azulejoCost
      });
      
      const sacosCola = Math.ceil(squareMeters * CONSUMPTION_RATIOS.mortero_cola_por_m2);
      const colaCost = sacosCola * MATERIAL_MARKET_PRICES.mortero_cola_c2te.price;
      results.push({
        name: `Mortero cola C2TE (${sacosCola} sacos de 25kg)`,
        qty: sacosCola,
        unit: 'sacos',
        price: MATERIAL_MARKET_PRICES.mortero_cola_c2te.price,
        total: colaCost
      });
      
      const horasAlicatado = squareMeters * CONSUMPTION_RATIOS.horas_alicatado_por_m2;
      const laborCost = horasAlicatado * MATERIAL_MARKET_PRICES.mano_obra_oficial.price;
      results.push({
        name: `Mano de obra alicatado (${horasAlicatado.toFixed(1)} horas)`,
        qty: horasAlicatado.toFixed(1),
        unit: 'horas',
        price: MATERIAL_MARKET_PRICES.mano_obra_oficial.price,
        total: laborCost
      });
      
      totalCost = azulejoCost + colaCost + laborCost;
      break;
      
    case 'solado':
      const sueloM2 = squareMeters * CONSUMPTION_RATIOS.azulejo_desperdicio;
      const sueloCost = sueloM2 * MATERIAL_MARKET_PRICES.suelo_laminado.price;
      results.push({
        name: `Suelo laminado AC4 (${sueloM2.toFixed(1)} m² con 10% desperdicio)`,
        qty: sueloM2.toFixed(1),
        unit: 'm²',
        price: MATERIAL_MARKET_PRICES.suelo_laminado.price,
        total: sueloCost
      });
      
      const sacosColaSolado = Math.ceil(squareMeters * CONSUMPTION_RATIOS.mortero_cola_por_m2);
      const colaSoladoCost = sacosColaSolado * MATERIAL_MARKET_PRICES.mortero_cola_c2te.price;
      results.push({
        name: `Mortero cola C2TE (${sacosColaSolado} sacos de 25kg)`,
        qty: sacosColaSolado,
        unit: 'sacos',
        price: MATERIAL_MARKET_PRICES.mortero_cola_c2te.price,
        total: colaSoladoCost
      });
      
      const horasSolado = squareMeters * CONSUMPTION_RATIOS.horas_alicatado_por_m2;
      const laborSoladoCost = horasSolado * MATERIAL_MARKET_PRICES.mano_obra_oficial.price;
      results.push({
        name: `Mano de obra solado (${horasSolado.toFixed(1)} horas)`,
        qty: horasSolado.toFixed(1),
        unit: 'horas',
        price: MATERIAL_MARKET_PRICES.mano_obra_oficial.price,
        total: laborSoladoCost
      });
      
      totalCost = sueloCost + colaSoladoCost + laborSoladoCost;
      break;
      
    case 'pintura':
      const pinturaLitros = squareMeters * CONSUMPTION_RATIOS.pintura_litros_por_m2;
      const pinturaCost = squareMeters * MATERIAL_MARKET_PRICES.pintura_plastica.price;
      results.push({
        name: `Pintura plástica mate (${pinturaLitros.toFixed(1)} litros, 2 manos)`,
        qty: pinturaLitros.toFixed(1),
        unit: 'litros',
        price: MATERIAL_MARKET_PRICES.pintura_plastica.price / CONSUMPTION_RATIOS.pintura_litros_por_m2,
        total: pinturaCost
      });
      
      const horasPintura = squareMeters * CONSUMPTION_RATIOS.horas_pintura_por_m2;
      const laborPinturaCost = horasPintura * MATERIAL_MARKET_PRICES.mano_obra_oficial.price;
      results.push({
        name: `Mano de obra pintura (${horasPintura.toFixed(1)} horas)`,
        qty: horasPintura.toFixed(1),
        unit: 'horas',
        price: MATERIAL_MARKET_PRICES.mano_obra_oficial.price,
        total: laborPinturaCost
      });
      
      totalCost = pinturaCost + laborPinturaCost;
      break;
      
    case 'desescombro':
      const horasDesescombro = squareMeters * CONSUMPTION_RATIOS.horas_desescombro_por_m2;
      const laborDesescombroCost = horasDesescombro * MATERIAL_MARKET_PRICES.mano_obra_oficial.price;
      results.push({
        name: `Mano de obra desescombro (${horasDesescombro.toFixed(1)} horas)`,
        qty: horasDesescombro.toFixed(1),
        unit: 'horas',
        price: MATERIAL_MARKET_PRICES.mano_obra_oficial.price,
        total: laborDesescombroCost
      });
      
      const sacosEscombro = Math.ceil(squareMeters / 2.5);
      const costeGestion = sacosEscombro * 3.50;
      results.push({
        name: `Gestión de escombros (${sacosEscombro} sacos)`,
        qty: sacosEscombro,
        unit: 'sacos',
        price: 3.50,
        total: costeGestion
      });
      
      totalCost = laborDesescombroCost + costeGestion;
      break;
  }
  
  return { items: results, total: totalCost };
}

function updateCalculator() {
  const workType = document.getElementById('calc-type').value;
  const m2 = parseFloat(document.getElementById('calc-m2').value) || 0;
  const margin = parseFloat(document.getElementById('calc-margin').value) || 0;
  
  document.getElementById('margin-display').textContent = margin + '%';
  
  const calc = calculateMaterials(workType, m2);
  const costTotal = calc.total;
  const saleTotal = costTotal * (1 + margin / 100);
  const profit = saleTotal - costTotal;
  
  let html = `
    <div class="calc-result">
      <h3>📦 Materiales Necesarios</h3>
      ${calc.items.map(item => `
        <div class="calc-item">
          <div class="name">${item.name}</div>
          <div class="qty">${item.qty} ${item.unit}</div>
          <div class="price">${fmt(item.total)}</div>
        </div>
      `).join('')}
    </div>
    
    <div class="dual-budget">
      <div class="budget-card cost">
        <div class="label"> Coste Real</div>
        <div class="amount">${fmt(costTotal)}</div>
      </div>
      <div class="budget-card sale">
        <div class="label">💵 Precio Venta</div>
        <div class="amount">${fmt(saleTotal)}</div>
      </div>
    </div>
    
    <div class="margin-control">
      <h4>📊 Análisis de Margen</h4>
      <div class="calc-item">
        <div class="name">Beneficio bruto</div>
        <div class="qty">${fmt(profit)}</div>
      </div>
      <div class="calc-item">
        <div class="name">Margen aplicado</div>
        <div class="qty">${margin}%</div>
      </div>
    </div>
  `;
  
  document.getElementById('calc-results').innerHTML = html;
}

function addCalcToBudget() {
  const workType = document.getElementById('calc-type').value;
  const m2 = parseFloat(document.getElementById('calc-m2').value) || 0;
  const margin = parseFloat(document.getElementById('calc-margin').value) || 0;
  
  if (m2 <= 0) {
    alert('Introduce los metros cuadrados');
    return;
  }
  
  const calc = calculateMaterials(workType, m2);
  const costTotal = calc.total;
  const saleTotal = costTotal * (1 + margin / 100);
  
  // Guardar en estado temporal para usar en budgetEdit
  state.calculatedItems = calc.items;
  state.calculatedCost = costTotal;
  state.calculatedSale = saleTotal;
  state.calculatedMargin = margin;
  
  navigate('budgetEdit', { id: 'new', fromCalculator: true });
}

function renderTotals(items, discount = 0) {
  const subtotal = items.reduce((s, i) => s + (i.qty || 0) * (i.price || 0), 0);
  const discountAmount = subtotal * (discount || 0) / 100;
  const base = subtotal - discountAmount;
  const iva = base * state.config.ivaRate / 100;
  const total = base + iva;
  
  return `
    <div class="row"><span>Subtotal</span><span>${fmt(subtotal)}</span></div>
    ${discount > 0 ? `<div class="row"><span>Descuento (${discount}%)</span><span>-${fmt(discountAmount)}</span></div>` : ''}
    <div class="row"><span>Base imponible</span><span>${fmt(base)}</span></div>
    <div class="row"><span>IVA (${state.config.ivaRate}%)</span><span>${fmt(iva)}</span></div>
    <div class="row grand"><span>TOTAL</span><span>${fmt(total)}</span></div>
  `;
}

      </div>
      
      <button class="btn-big" onclick="saveSettings()" style="margin-top:16px">
         Guardar Configuración
      </button>
      
      <button class="btn-big secondary" onclick="exportData()" style="margin-top:12px">
        📤 Exportar Datos (Backup)
      </button>
      
      <button class="btn-big secondary" onclick="document.getElementById('import-file').click()" style="margin-top:12px">
         Importar Datos
      </button>
      <input type="file" id="import-file" accept=".json" style="display:none" onchange="importData(event)">
      
      <button class="btn-big danger" onclick="resetAll()" style="margin-top:24px">
        ⚠️ Borrar Todos los Datos
      </button>
      
      <div style="text-align:center; color:var(--text-dim); margin-top:30px; font-size:0.85rem">
        ObraExpress v1.2<br>
        Tus datos se guardan solo en este dispositivo.
      </div>
    </div>
  `;
}

// ---------- ACCIONES ----------
function attachViewEvents() {
  document.querySelectorAll('#lines-container input').forEach(inp => {
    inp.addEventListener('input', () => updateTotals());
  });
  
  if (state.view === 'calculator') {
    updateCalculator();
  }
  
  if (state.view === 'budgetEdit' && state.params?.fromCalculator) {
    updateBudgetMargin();
  }
}

function updateBudgetMargin() {
  const margin = parseFloat(document.getElementById('b_margin').value) || 0;
  document.getElementById('margin-display').textContent = margin + '%';
  
  const items = getLinesFromUI();
  const costTotal = items.reduce((s, i) => s + (i.qty || 0) * (i.price || 0), 0);
  const saleTotal = costTotal * (1 + margin / 100);
  
  document.getElementById('cost-total').textContent = fmt(costTotal);
  document.getElementById('sale-total').textContent = fmt(saleTotal);
}

function saveClient(id) {
  const name = document.getElementById('c_name').value.trim();
  if (!name) { alert('El nombre es obligatorio'); return; }
  
  const data = {
    name,
    nif: document.getElementById('c_nif').value.trim(),
    address: document.getElementById('c_address').value.trim(),
    phone: document.getElementById('c_phone').value.trim(),
    email: document.getElementById('c_email').value.trim()
  };
  
  if (id === 'new') {
    state.clients.push({ id: uid(), ...data });
  } else {
    const idx = state.clients.findIndex(c => c.id === id);
    if (idx >= 0) state.clients[idx] = { ...state.clients[idx], ...data };
  }
  saveState();
  navigate('clients');
}

function deleteClient(id) {
  if (!confirm('¿Eliminar este cliente?')) return;
  state.clients = state.clients.filter(c => c.id === id);
  saveState();
  render();
}

function addLine() {
  const container = document.getElementById('lines-container');
  const idx = container.children.length;
  const div = document.createElement('div');
  div.innerHTML = renderLineItem({ name: '', unit: 'ud', price: 0, qty: 0 }, idx);
  container.appendChild(div.firstElementChild);
}

function updateLine(idx, field, value) {
  updateTotals();
}

function removeLine(idx) {
  const container = document.getElementById('lines-container');
  const lines = container.querySelectorAll('.line-item');
  if (lines[idx]) lines[idx].remove();
  updateTotals();
}

function getLinesFromUI() {
  const container = document.getElementById('lines-container');
  const lines = container.querySelectorAll('.line-item');
  const items = [];
  lines.forEach(line => {
    const inputs = line.querySelectorAll('input');
    items.push({
      name: inputs[0].value,
      unit: inputs[1].value,
      price: parseFloat(inputs[2].value) || 0,
      qty: parseFloat(inputs[3].value) || 0
    });
  });
  return items.filter(i => i.name.trim());
}

function updateTotals() {
  const items = getLinesFromUI();
  const discountEl = document.querySelector('#b_discount, #i_discount');
  const discount = discountEl ? parseFloat(discountEl.value) || 0 : 0;
  const block = document.getElementById('totals-block');
  if (block) block.innerHTML = renderTotals(items, discount);
  
  if (state.view === 'budgetEdit') {
    updateBudgetMargin();
  }
}

function loadTemplate(id) {
  const tpl = state.templates.find(t => t.id === id);
  if (!tpl) return;
  if (!confirm(`¿Cargar plantilla "${tpl.name}"? Se reemplazarán las líneas actuales.`)) return;
  
  const container = document.getElementById('lines-container');
  container.innerHTML = tpl.items.map((item, i) => renderLineItem({ ...item, qty: 1 }, i)).join('');
  updateTotals();
}

function saveBudget(id) {
  const title = document.getElementById('b_title').value.trim();
  const clientId = document.getElementById('b_client').value;
  if (!title || !clientId) { alert('Título y cliente son obligatorios'); return; }
  
  const margin = parseFloat(document.getElementById('b_margin').value) || 0;
  const items = getLinesFromUI();
  const costTotal = items.reduce((s, i) => s + (i.qty || 0) * (i.price || 0), 0);
  const saleTotal = costTotal * (1 + margin / 100);
  
  const data = {
    title,
    clientId,
    date: document.getElementById('b_date').value,
    validity: parseInt(document.getElementById('b_validity').value) || 15,
    items: items.map(i => ({...i, price: i.price * (1 + margin / 100)})), // Aplicar margen a cada línea
    margin: margin,
    costTotal: costTotal,
    saleTotal: saleTotal,
    total: saleTotal * (1 + state.config.ivaRate / 100),
    notes: document.getElementById('b_notes').value.trim()
  };
  
  if (id === 'new') {
    state.budgets.push({ id: uid(), ...data });
  } else {
    const idx = state.budgets.findIndex(b => b.id === id);
    if (idx >= 0) state.budgets[idx] = { ...state.budgets[idx], ...data };
  }
  saveState();
  navigate('budgets');
}

function deleteBudget(id) {
  if (!confirm('¿Eliminar este presupuesto?')) return;
  state.budgets = state.budgets.filter(b => b.id === id);
  saveState();
  render();
}

function saveInvoice(id) {
  const number = document.getElementById('i_number').value.trim();
  const clientId = document.getElementById('i_client').value;
  if (!number || !clientId) { alert('Nº factura y cliente son obligatorios'); return; }
  
  const data = {
    number,
    clientId,
    date: document.getElementById('i_date').value,
    dueDate: document.getElementById('i_due').value,
    items: getLinesFromUI(),
    discount: parseFloat(document.getElementById('i_discount').value) || 0,
    notes: document.getElementById('i_notes').value.trim(),
    total: calculateTotal()
  };
  
  if (id === 'new') {
    state.invoices.push({ id: uid(), ...data });
  } else {
    const idx = state.invoices.findIndex(i => i.id === id);
    if (idx >= 0) state.invoices[idx] = { ...state.invoices[idx], ...data };
  }
  saveState();
  navigate('invoices');
}

function deleteInvoice(id) {
  if (!confirm('¿Eliminar esta factura?')) return;
  state.invoices = state.invoices.filter(i => i.id === id);
  saveState();
  render();
}

function generateInvoiceNumber() {
  const year = new Date().getFullYear();
  const count = state.invoices.filter(i => i.number?.startsWith(year)).length + 1;
  return `${year}-${String(count).padStart(3, '0')}`;
}

function convertToInvoice(budgetId) {
  const budget = state.budgets.find(b => b.id === budgetId);
  if (!budget) return;
  if (!confirm('¿Crear factura desde este presupuesto?')) return;
  navigate('invoiceEdit', { id: 'new', fromBudget: budgetId });
}

function saveSettings() {
  state.config = {
    businessName: document.getElementById('s_name').value.trim(),
    nif: document.getElementById('s_nif').value.trim(),
    address: document.getElementById('s_address').value.trim(),
    phone: document.getElementById('s_phone').value.trim(),
    email: document.getElementById('s_email').value.trim(),
    iban: document.getElementById('s_iban').value.trim(),
    ivaRate: parseFloat(document.getElementById('s_iva').value) || 21,
    defaultMargin: parseFloat(document.getElementById('s_margin').value) || 30
  };
  saveState();
  alert('Configuración guardada');
}

function exportData() {
  const data = JSON.stringify({ state, config: state.config }, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `obraexpress_backup_${today()}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (data.state) {
        state = { ...state, ...data.state };
        if (data.config) state.config = { ...state.config, ...data.config };
        saveState();
        render();
        alert('Datos importados correctamente');
      }
    } catch(err) { alert('Error al importar: ' + err.message); }
  };
  reader.readAsText(file);
}

function resetAll() {
  if (!confirm('¿BORRAR TODOS LOS DATOS? Esta acción no se puede deshacer.')) return;
  if (!confirm('¿Seguro? Se perderán clientes, presupuestos y facturas.')) return;
  localStorage.removeItem(STORE_KEY);
  localStorage.removeItem(CONFIG_KEY);
  location.reload();
}

// ---------- PDF GENERATOR ----------
function buildHTMLDoc(type, doc) {
  const client = state.clients.find(c => c.id === doc.clientId);
  const c = state.config;
  const isBudget = type === 'budget';
  const title = isBudget ? 'PRESUPUESTO' : 'FACTURA';
  const number = isBudget ? `PRES-${doc.id.substr(-6).toUpperCase()}` : doc.number;
  
  let itemsHtml = doc.items.map((item, i) => `
    <tr>
      <td style="padding:8px; border-bottom:1px solid #ddd">${i+1}</td>
      <td style="padding:8px; border-bottom:1px solid #ddd">${escapeHtml(item.name)}</td>
      <td style="padding:8px; border-bottom:1px solid #ddd; text-align:center">${escapeHtml(item.unit)}</td>
      <td style="padding:8px; border-bottom:1px solid #ddd; text-align:right">${(item.qty||0).toFixed(2)}</td>
      <td style="padding:8px; border-bottom:1px solid #ddd; text-align:right">${(item.price||0).toFixed(2)}€</td>
      <td style="padding:8px; border-bottom:1px solid #ddd; text-align:right">${((item.qty||0)*(item.price||0)).toFixed(2)}€</td>
    </tr>
  `).join('');
  
  const subtotal = doc.items.reduce((s, i) => s + (i.qty||0)*(i.price||0), 0);
  const iva = subtotal * c.ivaRate / 100;
  const total = subtotal + iva;
  
  return `
    <!DOCTYPE html>
    <html>
    <head>
      <meta charset="UTF-8">
      <title>${title} ${number}</title>
      <style>
        body { font-family: Arial, sans-serif; padding: 40px; color: #222; max-width: 800px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; border-bottom: 3px solid #ff6b00; padding-bottom: 20px; margin-bottom: 30px; }
        .company h1 { color: #ff6b00; margin: 0 0 8px 0; font-size: 24px; }
        .company p { margin: 2px 0; font-size: 13px; color: #555; }
        .doc-info { text-align: right; }
        .doc-info h2 { color: #ff6b00; margin: 0 0 8px 0; font-size: 28px; }
        .doc-info p { margin: 2px 0; font-size: 13px; }
        .client-box { background: #f5f5f5; padding: 15px; border-radius: 6px; margin-bottom: 25px; }
        .client-box h3 { margin: 0 0 8px 0; font-size: 13px; color: #888; text-transform: uppercase; }
        .client-box p { margin: 2px 0; font-size: 14px; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        th { background: #ff6b00; color: #000; padding: 10px 8px; text-align: left; font-size: 13px; }
        .totals { margin-left: auto; width: 300px; }
        .totals .row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 14px; }
        .totals .row.grand { border-top: 2px solid #ff6b00; margin-top: 8px; padding-top: 10px; font-size: 18px; font-weight: bold; color: #ff6b00; }
        .notes { margin-top: 30px; padding: 15px; background: #f9f9f9; border-left: 3px solid #ff6b00; font-size: 13px; }
        .footer { margin-top: 40px; text-align: center; font-size: 11px; color: #888; border-top: 1px solid #ddd; padding-top: 15px; }
        @media print { body { padding: 20px; } }
      </style>
    </head>
    <body>
      <div class="header">
        <div class="company">
          <h1>${escapeHtml(c.businessName)}</h1>
          ${c.nif ? `<p>NIF: ${escapeHtml(c.nif)}</p>` : ''}
          ${c.address ? `<p>${escapeHtml(c.address)}</p>` : ''}
          ${c.phone ? `<p>Tel: ${escapeHtml(c.phone)}</p>` : ''}
          ${c.email ? `<p>${escapeHtml(c.email)}</p>` : ''}
        </div>
        <div class="doc-info">
          <h2>${title}</h2>
          <p><strong>Nº:</strong> ${number}</p>
          <p><strong>Fecha:</strong> ${doc.date}</p>
          ${isBudget && doc.validity ? `<p><strong>Validez:</strong> ${doc.validity} días</p>` : ''}
          ${!isBudget && doc.dueDate ? `<p><strong>Vencimiento:</strong> ${doc.dueDate}</p>` : ''}
        </div>
      </div>
      
      ${client ? `
        <div class="client-box">
          <h3>Cliente</h3>
          <p><strong>${escapeHtml(client.name)}</strong></p>
          ${client.nif ? `<p>NIF: ${escapeHtml(client.nif)}</p>` : ''}
          ${client.address ? `<p>${escapeHtml(client.address)}</p>` : ''}
          ${client.phone ? `<p>Tel: ${escapeHtml(client.phone)}</p>` : ''}
          ${client.email ? `<p>${escapeHtml(client.email)}</p>` : ''}
        </div>
      ` : ''}
      
      <table>
        <thead>
          <tr>
            <th style="width:40px">#</th>
            <th>Concepto</th>
            <th style="width:60px">Ud</th>
            <th style="width:70px">Cant</th>
            <th style="width:90px">Precio</th>
            <th style="width:100px">Total</th>
          </tr>
        </thead>
        <tbody>${itemsHtml}</tbody>
      </table>
      
      <div class="totals">
        <div class="row"><span>Base imponible</span><span>${subtotal.toFixed(2)}€</span></div>
        <div class="row"><span>IVA (${c.ivaRate}%)</span><span>${iva.toFixed(2)}€</span></div>
        <div class="row grand"><span>TOTAL</span><span>${total.toFixed(2)}€</span></div>
      </div>
      
      ${doc.notes ? `<div class="notes"><strong>Notas:</strong><br>${escapeHtml(doc.notes).replace(/\n/g,'<br>')}</div>` : ''}
      
      ${!isBudget && c.iban ? `<div style="margin-top:20px; font-size:13px"><strong>IBAN:</strong> ${escapeHtml(c.iban)}</div>` : ''}
      
      <div class="footer">
        ${escapeHtml(c.businessName)} · ${escapeHtml(c.nif || '')}<br>
        Documento generado con ObraExpress
      </div>
    </body>
    </html>
  `;
}

function openPDF(type, doc) {
  const html = buildHTMLDoc(type, doc);
  const win = window.open('', '_blank');
  win.document.write(html);
  win.document.close();
  setTimeout(() => win.print(), 300);
}

function generateBudgetPDF(id) {
  const doc = state.budgets.find(b => b.id === id);
  if (doc) openPDF('budget', doc);
}

function generateInvoicePDF(id) {
  const doc = state.invoices.find(i => i.id === id);
  if (doc) openPDF('invoice', doc);
}

function shareBudgetWhatsApp(id) {
  const doc = state.budgets.find(b => b.id === id);
  const client = state.clients.find(c => c.id === doc.clientId);
  if (!doc || !client) return;
  
  const text = `Hola ${client.name}, te envío el presupuesto "${doc.title}" por ${fmt(doc.total)}. ¿Lo revisamos?`;
  const url = `https://wa.me/${(client.phone||'').replace(/\D/g,'')}?text=${encodeURIComponent(text)}`;
  window.open(url, '_blank');
}

function shareInvoiceWhatsApp(id) {
  const doc = state.invoices.find(i => i.id === id);
  const client = state.clients.find(c => c.id === doc.clientId);
  if (!doc || !client) return;
  
  const text = `Hola ${client.name}, te envío la factura ${doc.number} por ${fmt(doc.total)}. Gracias!`;
  const url = `https://wa.me/${(client.phone||'').replace(/\D/g,'')}?text=${encodeURIComponent(text)}`;
  window.open(url, '_blank');
}

// ---------- INIT ----------
loadState();
render();

// Service Worker básico para offline
if ('serviceWorker' in navigator) {
  const swCode = `
    self.addEventListener('install', e => self.skipWaiting());
    self.addEventListener('activate', e => e.waitUntil(self.clients.claim()));
    self.addEventListener('fetch', e => {
      e.respondWith(
        caches.open('obraexpress-v1').then(cache =>
          cache.match(e.request).then(r => r || fetch(e.request).then(resp => {
            cache.put(e.request, resp.clone());
            return resp;
          }).catch(() => cache.match('/')))
        )
      );
    });
  `;
  const blob = new Blob([swCode], { type: 'application/javascript' });
  const swUrl = URL.createObjectURL(blob);
  navigator.serviceWorker.register(swUrl).catch(() => {});
}
</script>
